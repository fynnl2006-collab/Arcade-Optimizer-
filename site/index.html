<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set-Optimierer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* VOICE matchday tool for a Sorare Set player: confident, sporty, tidy
   IDEA a team sheet on the pitch: the suggested five laid out in formation as collectible cards
   PICTURE a striped pitch with chalk lines and five edition-styled card tiles in formation
   COLOUR deep pitch green ground, chalk white, lime for chance and captain, coral for doubtful; card editions in their own finishes
   TYPE Barlow Condensed 700/800 for names and figures + Inter for text
   LAYOUT sticky nav; hero = status, chance ring and controls left, pitch right; sections below in full-width bands; phone stacks status, pitch, controls */
:root{color-scheme:light dark;--bg:light-dark(#f6f8f5,#08130e);--paper:light-dark(#ffffff,#0f1f18);--ink:light-dark(#0f1d16,#e9f2ed);--mute:light-dark(#5a6d63,#97ada2);--line:light-dark(#dde6e0,#1f3429);--g1:#0b3d2c;--g2:#0e4a35;--g3:#125a40;--chalk:#eef6f0;--lime:#c9f06a;--acc:light-dark(#2c8a28,#c9f06a);--warn:#ff5b45;--track:light-dark(#e2eae5,#1b3027)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:110px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.d{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",Inter,sans-serif;letter-spacing:-.01em;line-height:1.02}
h1{font-size:clamp(36px,5vw,52px);font-weight:800;margin:0;text-wrap:balance}
h2{font-size:clamp(28px,3.4vw,38px);font-weight:700;margin:0 0 6px}
h3{font-size:22px;font-weight:700;margin:0}
p{margin:0}
a{color:inherit}
button,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(36px,5vw,72px) 0}
.lead{color:var(--mute);max-width:64ch;margin-bottom:22px}
.mute{color:var(--mute)}
/* nav */
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--g1) 94%,transparent);backdrop-filter:blur(8px);color:var(--chalk);border-bottom:1px solid #ffffff18}
nav .wrap{display:flex;align-items:center;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font:800 24px "Barlow Condensed",sans-serif;text-decoration:none;white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--lime);display:grid;place-items:center;color:var(--g1);font-style:normal;font-size:19px}
.links{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.links a{flex:none;text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:15px;color:#cfe2d7}
.links a:hover{background:#ffffff14;color:#fff}
.nb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #ffffff33;background:transparent;color:var(--chalk);cursor:pointer;font-weight:600;position:relative}
.nb:focus-visible,.chip:focus-visible,input:focus-visible,.daycol:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.nb em{position:absolute;top:-6px;right:-6px;background:var(--warn);color:#fff;font:600 12px Inter,sans-serif;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.nb em[hidden]{display:none}
.notes{position:absolute;right:max(4vw,16px);top:66px;width:min(420px,calc(100vw - 32px));background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px #0004;padding:16px}
.notes[hidden]{display:none}
.notes ul{list-style:none;margin:10px 0;padding:0;max-height:50vh;overflow:auto}
.notes li{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.notes li.u{font-weight:600}
/* hero */
.hero{background:var(--g1);color:var(--chalk);padding:clamp(28px,4vw,56px) 0 clamp(36px,5vw,64px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px);align-items:start}
.kicker{color:#b9d6c6;font-size:15px;margin-bottom:8px}
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:20px 0}
.st{border-radius:10px;padding:7px 4px;text-align:center;background:#ffffff10;border:1px solid #ffffff1c;font-size:12px;color:#bcd5c8}
.st b{display:block;font:700 22px "Barlow Condensed",sans-serif;color:#fff}
.st.done{opacity:.5}
.st.cur{background:var(--lime);border-color:var(--lime);color:var(--g1)}
.st.cur b{color:var(--g1)}
.score{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;margin:8px 0 22px}
.ring{--p:0;width:150px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1turn),#ffffff1f 0);display:grid;place-items:center}
.ring div{width:78%;aspect-ratio:1;border-radius:50%;background:var(--g1);display:grid;place-content:center;text-align:center}
.ring .d{font-size:46px;font-weight:800}
.ring small{font-size:12px;color:#b9d6c6}
.facts{display:grid;gap:4px;font-size:15px;color:#cfe2d7}
.facts b{color:#fff;font-weight:600}
.panel{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:16px;padding:16px;display:grid;gap:14px}
.lbl{display:block;font-size:13px;color:#b9d6c6;margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.chip{min-height:44px;border-radius:10px;border:1px solid #ffffff2e;background:#ffffff0f;color:var(--chalk);cursor:pointer;font:700 20px "Barlow Condensed",sans-serif}
.chip[aria-pressed=true]{background:var(--lime);color:var(--g1);border-color:var(--lime)}
input[type=range]{width:100%;height:44px;accent-color:var(--lime);margin:0}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.sw input{width:22px;height:22px;accent-color:var(--warn)}
.lives{display:inline-flex;align-items:center;gap:8px}
.lives button{width:36px;height:36px;border-radius:9px;border:1px solid #ffffff33;background:transparent;color:var(--chalk);cursor:pointer;font-size:18px}
/* pitch */
.pitch{position:relative;border-radius:18px;padding:22px 14px;background:repeating-linear-gradient(180deg,var(--g3) 0 56px,#16664a 56px 112px);box-shadow:inset 0 0 0 2px #ffffff2a,0 20px 40px #0005;overflow:hidden}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.form{position:relative;display:grid;gap:16px}
.line{display:flex;justify-content:center;gap:clamp(10px,3vw,34px)}
.tag-row{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#d7eadf;font-size:14px;gap:10px;flex-wrap:wrap}
/* card tile */
.cd{--fg:#14211b;position:relative;width:clamp(118px,13vw,142px);aspect-ratio:5/7;border-radius:12px;padding:8px;display:flex;flex-direction:column;color:var(--fg);box-shadow:0 10px 18px #0006,inset 0 0 0 1px #ffffff66;overflow:hidden;text-decoration:none}
.cd::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff55 48%,transparent 60%);pointer-events:none}
.cd .top{display:flex;justify-content:space-between;align-items:center;gap:4px;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.03em}
.cd .pos{background:#0b3d2ce0;color:#eef6f0;border-radius:5px;padding:1px 6px}
.cd .ed{font:600 10px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;text-align:center;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .mono{margin:auto;width:52%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:800 clamp(22px,2.4vw,28px) "Barlow Condensed",sans-serif;background:#ffffff66;box-shadow:inset 0 0 0 2px #ffffff99}
.cd .nm{font:700 17px/1 "Barlow Condensed",sans-serif;text-align:center;min-height:2em;display:grid;place-items:center;overflow-wrap:anywhere}
.cd .bt{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-size:12px}
.cd .bt b{font:800 24px "Barlow Condensed",sans-serif}
.cap{position:absolute;top:32px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--g1);font:800 15px "Barlow Condensed",sans-serif;box-shadow:0 2px 6px #0005,inset 0 0 0 2px #0b3d2c;z-index:2}
.dbt{position:absolute;left:8px;bottom:42px;background:var(--warn);color:#fff;font:600 10px Inter,sans-serif;padding:1px 5px;border-radius:4px}
.e-Standard{background:linear-gradient(160deg,#f1f4f6,#c7d1d8)}
.e-Shiny{background:linear-gradient(135deg,#f6f8fa 0%,#ced6dc 38%,#ffffff 50%,#b9c3cb 62%,#eef1f4 100%)}
.e-Holo{background:linear-gradient(135deg,#ffd6ec,#c9efff 30%,#dcffd2 55%,#fff1c2 80%,#ffd6ec)}
.e-Four{background:radial-gradient(circle at 20% 20%,#ffffffaa 0 6%,transparent 7%) 0 0/28px 28px,linear-gradient(135deg,#eef2f5,#bcc6ce 50%,#f4f6f8)}
.e-Eclipse{--fg:#eef6f0;background:linear-gradient(135deg,#0f2a3d,#1f5068 45%,#0e3c45 70%,#2b6b73)}
.e-Eclipse .mono{background:#ffffff1f;box-shadow:inset 0 0 0 2px #ffffff55}
.e-Action{background:linear-gradient(135deg,#d6eeff,#8cc3ff 45%,#e8f6ff)}
.e-Legendary{background:linear-gradient(135deg,#fff3c2,#f2c94c 40%,#c8961a 68%,#ffe397)}
.cd.sm{width:100%;aspect-ratio:auto;min-height:168px;padding:6px}
.cd.sm .mono{width:62%;font-size:20px;margin:6px auto}
.cd.sm .nm{font-size:15px}
.cd.sm .bt b{font-size:20px}
.cd.sm .cap{top:28px;right:5px;width:22px;height:22px;font-size:13px}
.cd.sm .top{font-size:12px}
/* sections */
.cards5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.det{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.det li{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:4px 14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.det .sw2{width:50px;height:70px;border-radius:8px;box-shadow:inset 0 0 0 1px #0000001a;display:grid;place-items:center;font:800 22px "Barlow Condensed",sans-serif;color:#14211b}
.det .sw2.e-Eclipse{color:#eef6f0}
.det h3 b{font-weight:700}
.det li{grid-template-areas:"sw main num" "sw why lnk"}
.det .sw2{grid-area:sw}.det .main{grid-area:main}.det .num{grid-area:num}.det .why{grid-area:why;font-size:14px;color:var(--mute)}.det .lnk{grid-area:lnk;font-size:13px;color:var(--acc);text-align:right;white-space:nowrap}
.det .meta{font-size:14px;color:var(--mute)}
.det .num{text-align:right;white-space:nowrap}
.det .num b{display:block;font:800 30px "Barlow Condensed",sans-serif}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--track);white-space:nowrap;vertical-align:middle}
.pill.w{background:var(--warn);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.box .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.box .hd .d{flex:none;font-size:clamp(30px,4vw,40px);font-weight:800}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.days{display:flex;align-items:flex-end;gap:10px;height:240px;padding-top:24px}
.daycol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;border:0;background:none;cursor:pointer;border-radius:10px;padding:4px 0}
.daycol .bars{position:relative;width:min(56px,80%);flex:1;display:flex;align-items:flex-end}
.daycol .a{position:absolute;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--acc) 35%,transparent);border-radius:8px 8px 0 0}
.daycol .b{position:absolute;bottom:0;left:18%;right:18%;background:var(--acc);border-radius:6px 6px 0 0}
.daycol .v{font:700 18px "Barlow Condensed",sans-serif;white-space:nowrap}
.daycol .l{font-size:13px;color:var(--mute);white-space:nowrap}
.daycol[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.daycol[aria-pressed=true] .l{color:var(--ink);font-weight:700}
.legend{display:flex;gap:16px;font-size:14px;color:var(--mute);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.alt{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.alt li{display:grid;grid-template-columns:7em minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.alt .o{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:15px}
.alt .o span:last-child{white-space:nowrap;color:var(--mute)}
.up{color:var(--acc);font-weight:600}
.bad{color:var(--warn);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fchip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600}
.fchip[aria-pressed=true]{background:var(--g1);color:var(--chalk);border-color:var(--g1)}
.filters input{min-height:44px;flex:1 1 220px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--paper);font-size:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.pc{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.pc .sw2{width:54px;height:72px;border-radius:9px;box-shadow:inset 0 0 0 1px #0000001a;display:grid;place-items:center;font:800 20px "Barlow Condensed",sans-serif;color:#14211b}
.pc .sw2.e-Eclipse{color:#eef6f0}
.pc h3{font-size:19px}
.pc .m{font-size:13px;color:var(--mute)}
.pc .k{display:flex;gap:12px;font-size:13px;margin-top:4px;flex-wrap:wrap}
.pc .k b{font:800 20px "Barlow Condensed",sans-serif}
.hr{display:grid;gap:12px}
.hrow{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:12px;align-items:center;font-size:15px}
.hrow .t{position:relative;height:16px;background:var(--track);border-radius:8px;overflow:hidden}
.hrow .t i{position:absolute;inset:0 auto 0 0;border-radius:8px}
.hrow .v{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mute)}
footer{background:var(--g1);color:#b9d6c6;font-size:14px;padding:32px 0}
.empty{color:var(--mute)}
.range2{position:relative;height:44px}
.range2 input{position:absolute;inset:0;width:100%;height:44px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range2 input::-webkit-slider-runnable-track{background:none;border:0}
.range2 input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;background:radial-gradient(circle,var(--lime) 0 11px,var(--g1) 11px 14px,transparent 14.5px);cursor:pointer}
.range2 input::-moz-range-thumb{pointer-events:auto;width:28px;height:28px;border-radius:50%;background:var(--lime);border:3px solid var(--g1);cursor:pointer}
.range2 input::-moz-range-track{background:none}
.range2 input:focus-visible{outline:none}
.range2 input:focus-visible::-webkit-slider-thumb{background:radial-gradient(circle,var(--lime) 0 11px,var(--g1) 11px 14px,#fff 14px 17px,transparent 17.5px)}
.rtrack{position:absolute;left:22px;right:22px;top:19px;height:6px;border-radius:3px;background:#ffffff2e}
.rfill{position:absolute;top:0;bottom:0;background:var(--lime);border-radius:3px}
.ticks{display:flex;justify-content:space-between;margin:0 6px 4px;font-size:12px;color:#b9d6c6}
.ticks span{width:32px;text-align:center}
.daycol[disabled]{opacity:.35;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mc{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.mh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.mh .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--g1);color:var(--chalk);font:700 16px "Barlow Condensed",sans-serif}
.mh h3{font-size:22px}
.mh .m{font-size:13px;color:var(--mute)}
.mh .big{font:800 34px "Barlow Condensed",sans-serif;white-space:nowrap}
.wdl{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--track)}
.wdl i{display:block;height:100%}
.wdl .w{background:var(--acc)}.wdl .d{background:color-mix(in srgb,var(--mute) 45%,transparent)}.wdl .l{background:color-mix(in srgb,var(--warn) 70%,transparent)}
.wdlt{font-size:13px;color:var(--mute);margin-top:4px}
.ms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.ms div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ms dt{font-size:12px;color:var(--mute)}
.ms dd{margin:0;font:700 20px "Barlow Condensed",sans-serif}
.fm{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font:700 12px Inter,sans-serif;color:#fff;margin-right:3px}
.fm.W{background:#2c8a28}.fm.D{background:#8a9a91}.fm.L{background:#d8503e}
.mrow{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
.mcards{display:flex;gap:6px;flex-wrap:wrap}
.chip2{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.chip2 i{width:12px;height:16px;border-radius:3px;box-shadow:inset 0 0 0 1px #0002}
.chip2 b{font-family:"Barlow Condensed",sans-serif;font-size:16px}
.prband{background:var(--g1);color:var(--chalk)}
.prband .lead{color:#b9d6c6}
.prctl{display:grid;gap:4px;margin-bottom:18px}
.prctl .filters{margin-bottom:8px}
.prctl .fchip{background:#ffffff0f;color:var(--chalk);border-color:#ffffff2e}
.prctl .fchip[aria-pressed=true]{background:var(--lime);color:var(--g1);border-color:var(--lime)}
.lbl2{display:block;font-size:13px;color:#b9d6c6;margin-bottom:6px}
.prhead{display:flex;gap:6px 18px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.prbig{font:800 clamp(48px,7vw,72px) "Barlow Condensed",sans-serif;color:var(--lime);line-height:1}
.prhead b{font-size:17px}
.prhead p{font-size:14px;color:#b9d6c6}
.prsteps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prstep{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:16px;padding:14px;display:grid;gap:10px}
.prs-h{display:flex;gap:12px;align-items:center}
.prs-h h3{font-size:22px}
.prs-h p{font-size:14px;color:#cfe2d7}
.prn{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--g1);display:grid;place-items:center;font:800 18px "Barlow Condensed",sans-serif;flex:none}
.prsub{font-size:13px;color:#b9d6c6;margin-bottom:4px}
.prr{font-size:13px;color:#b9d6c6}
.prgap{font-size:13px;color:#b9d6c6;margin-left:16px;padding:4px 0 4px 20px;border-left:2px dashed #ffffff40}
.prband .empty{color:#cfe2d7}
@media(max-width:1000px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.cards5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}nav .wrap{flex-wrap:wrap;gap:8px 12px}.links{order:3;flex-basis:100%;margin:0 -8px;padding-bottom:6px}.brand{flex:1}.det li{grid-template-columns:42px minmax(0,1fr) auto;gap:6px 10px;padding:12px}.det .sw2{width:42px;height:58px;font-size:17px;grid-row:auto}.det li{grid-template-areas:"sw main num" "why why why" "lnk lnk lnk"}.det .lnk{text-align:left;min-height:32px;display:flex;align-items:center}}

  $("facts").innerHTML=l?`<b>${esc(tr("f_exp",{v:num(l.mean)}))}</b><span>${esc(tr("f_rng",{a:num(l.p10),b:num(l.p90)}))}</span><span>${esc(tr("f_lock",{t:when(l.lock)}))} · ${esc(tr("f_last",{t:when(l.last)}))}</span>${S.dbt?`<span class="bad">${esc(tr("dbt_note"))}</span>`:""}`:`<span>${esc(tr("none"))}</span>`;
  // pitch: rows by position, attack on top
  if(!l||!nL()){$("pitchhead").innerHTML="";$("form").innerHTML=`<p style="color:#fff">${esc(tr("none"))}</p>`;return}
  const rows={F:[],M:[],D:[],G:[]};
  for(const [id,slot,c,cs,ed,b] of l.pl){const p=slot==="EXTRA"?D.items[id].pos:posOf(slot);rows[p].push(card(id,slot,c,cs,ed,b))}
  const cap=l.pl.find(x=>x[2]);
  $("pitchhead").innerHTML=`<b class="d" style="font-size:22px;color:#fff">${esc(tr("pitch"))}</b><span>${esc(tr("pitch_ok",{c:cap?D.items[cap[0]].n:"–"}))}</span>`;
  $("form").innerHTML=["F","M","D","G"].filter(k=>rows[k].length).map(k=>`<div class="line">${rows[k].join("")}</div>`).join("");
}

function renderDetail(){
  $("t-detail").textContent=tr("detail");$("detail-lead").textContent=tr("detail_lead");
  const sg=sug();const l=sg&&sg.l[0];
  if(!l||!nL()){$("detail").innerHTML=`<li class="empty">${esc(tr("none"))}</li>`;return}
  $("detail").innerHTML=l.pl.map(([id,slot,c,cs,ed,b])=>{const it=D.items[id];const e=ed||it.ed;const bb=b??it.b;const mult=c?(1+bb+.5)/(1+it.b):(1+bb)/(1+it.b);
    return `<li><span class="sw2 ${edc(e)}">${esc(initials(it.n))}</span><div class="main"><h3>${esc(it.n)} ${c?`<span class="pill" style="background:var(--lime);color:#0b3d2c">${esc(tr("captain"))}</span>`:""} ${it.dbt?`<span class="pill w">${esc(tr("doubtful_tag"))}</span>`:""}</h3>
<p class="meta">${esc(tr("slot_"+slot))} · ${esc(e)}${bb?" +"+Math.round(bb*100)+"\u00a0%":""}</p>
<p class="meta">${esc(it.m)} · ${esc(when(it.d))} · ${esc(tr(it.av==="grade"?"late":"early"))}</p></div>
<div class="num"><b>${num(it.mean*mult)}</b><span class="mute" style="font-size:13px">${esc(tr("plays"))} ${esc(pct(it.pp??0))}</span></div><a class="lnk" href="${esc(sorareUrl(cs||""))}" target="_blank" rel="noopener">${esc(tr("open"))} ↗</a><p class="why">${(it.why||[]).slice(0,3).map(w=>esc(reason(w))).join(" ")}</p></li>`}).join("");
}

function renderMore(){
  $("t-more").textContent=tr("more");$("more-lead").textContent=tr("more_lead");
  const sg=sug();const n=nL();
  if(!sg||sg.l.length<2||n<2){$("more").innerHTML=`<p class="empty">${esc(tr("none"))}</p>`;return}
  $("more").innerHTML=sg.l.slice(1,n).map((x,k)=>`<div class="box"><div class="hd"><div><h3>${esc(tr("lu",{n:k+2}))}</h3><p class="mute" style="font-size:14px">${esc(tr("together",{p:pct(x.pa)}))} · ${esc(tr("f_lock",{t:when(x.lock)}))}</p></div><span class="d">${esc(pct(x.p))}</span></div><div class="strip">${x.pl.map(([id,slot,c,cs,ed,b])=>card(id,slot,c,cs,ed,b).replace('class="cd ','class="cd sm ')).join("")}</div></div>`).join("");
}

function renderTime(){
  $("t-time").textContent=tr("time");$("time-lead").textContent=tr("time_lead");const n=nL();
  $("days").innerHTML=D.days.map((d,i)=>{const off=i<S.from;const sg=off?null:sug(S.from,i);const b=sg&&sg.l[0]?sg.l[0].p:0;const a=sg&&sg.l.length&&n?sg.l[Math.min(n,sg.l.length)-1].pa:0;
    return `<button class="daycol" data-i="${i}" aria-pressed="${i===S.to}"${off?" disabled":""}><span class="v">${off?"–":esc(pct(b))}</span><span class="bars"><span class="a" style="height:${(a*100).toFixed(1)}%"></span><span class="b" style="height:${(b*100).toFixed(1)}%"></span></span><span class="l">${esc(dayShort(d))}</span></button>`}).join("");
  for(const b of $("days").querySelectorAll("button"))b.onclick=()=>{S.to=+b.dataset.i;if(S.to<S.from)S.from=S.to;store.set("win",[S.from,S.to]);render()};
  $("days-leg").innerHTML=`<span><i style="background:var(--acc)"></i>${esc(tr("best"))}</span>${n>1?`<span><i style="background:color-mix(in srgb,var(--acc) 35%,transparent)"></i>${esc(tr("anyn",{n}))}</span>`:""}`;
  $("t-alts").textContent=tr("alts");$("alts-lead").textContent=tr("alts_lead");
  const sg=sug();if(!sg||!sg.l.length){$("alts").innerHTML="";return}
  $("alts").innerHTML=sg.alts.map((a,k)=>{const cur=D.items[sg.l[0].pl[k][0]];return `<li><div><b>${esc(tr("slot_"+a.slot))}</b><br><span class="mute">${esc(cur?cur.n:"")}</span></div><div>${a.opts.map(([id,p,dl])=>{const it=D.items[id];const t=Math.abs(dl)<.01?tr("equal"):(dl>0?"+":"−")+new Intl.NumberFormat(S.lang,{maximumFractionDigits:1}).format(Math.abs(dl*100))+" "+tr("pp");return `<div class="o"><span>${esc(it.n)} <span class="pill">${esc(it.ed)}</span>${it.dbt?` <span class="pill w">${esc(tr("doubtful_tag"))}</span>`:""}</span><span>${esc(pct(p))} · <span class="${dl>=.01?"up":""}">${esc(t)}</span></span></div>`}).join("")}</div></li>`}).join("");
}

function renderMine(){
  $("t-mine").textContent=tr("mine");$("mine-lead").textContent=tr("mine_lead");
  if(!D.my.length){$("mine").innerHTML=`<p class="empty">${esc(tr("no_mine"))}</p>`;return}
  $("mine").innerHTML=D.my.map((l,k)=>`<div class="box"><div class="hd"><div><h3>${esc(tr("lu",{n:k+1}))} · ${esc(tr(l.updatable?"open_l":"locked"))}</h3><p class="${l.impossible?"bad":"mute"}" style="font-size:14px">${esc(l.impossible?tr("impossible"):tr("pts",{a:num(l.points),b:num(l.need)}))}</p></div><span class="d">${esc(pct(l.p))}</span></div>
<div class="strip">${l.pl.map(c=>`<a class="cd sm ${edc(c.ed)}" href="${esc(sorareUrl(c.card||""))}" target="_blank" rel="noopener">${c.cap?`<span class="cap">${esc(tr("cap"))}</span>`:""}<span class="top"><span class="pos">${esc(tr(c.slot==="EXTRA"?"ps_X":"ps_"+posOf(c.slot)))}</span><span>${c.mult>1.001?"+"+Math.round((c.mult-1-(c.cap?.5:0))*100)+"%":""}</span></span><span class="mono">${esc(initials(c.name))}</span><span class="nm">${esc(c.name)}</span><span class="ed">${esc(c.ed||"Standard")}</span><span class="bt"><span>${esc(c.status==="PENDING"?when(c.date):tr("st_"+c.status))}</span><b>${c.status==="PENDING"?"–":num(c.score)}</b></span></a>`).join("")}</div>
${l.swaps.map(s=>`<p class="up" style="margin-top:10px">${esc(tr("swap",{out:s.out,in:D.items[s.item].n,p0:pct(l.p),p1:pct(s.p)}))}</p>`).join("")}</div>`).join("");
}

function renderPlayers(){
  $("t-players").textContent=tr("players");$("players-lead").textContent=tr("players_lead");
  $("filters").innerHTML=["all","G","D","M","F"].map(t=>`<button class="fchip" data-p="${t}" aria-pressed="${S.pos===t}">${esc(t==="all"?tr("all"):tr("pos_"+t))}</button>`).join("")+`<input id="q" type="search" placeholder="${esc(tr("search"))}" aria-label="${esc(tr("search"))}" value="${esc(S.q)}">`;
  for(const b of $("filters").querySelectorAll("button"))b.onclick=()=>{S.pos=b.dataset.p;renderPlayers()};
  $("q").oninput=e=>{S.q=e.target.value;drawPlayers()};
  drawPlayers();
}
function drawPlayers(){
  let ids=(S.pos==="all"?["G","D","M","F"]:[S.pos]).flatMap(p=>D.top[p]||[]).filter(id=>{const it=D.items[id];return it&&inWin(it.d)&&(!S.q||it.n.toLowerCase().includes(S.q.toLowerCase()))});
  ids.sort((a,b)=>D.items[b].mean-D.items[a].mean);
  $("pgrid").innerHTML=ids.length?ids.slice(0,48).map(id=>{const it=D.items[id];const w=(it.why||[])[0];return `<div class="pc"><span class="sw2 ${edc(it.ed)}">${esc(initials(it.n))}</span><div><h3>${esc(it.n)}</h3><p class="m">${esc(tr("ps_"+it.pos))} · ${esc(it.ed)} · ${esc(when(it.d))}</p><p class="m">${esc(it.m)}</p><div class="k"><span><b>${num(it.mean)}</b> ${esc(tr("exp"))}</span><span>${esc(tr("plays"))} ${esc(pct(it.pp??0))}</span><span>${esc(tr("c100"))} ${esc(pct(it.p100))}</span></div>${it.dbt?`<span class="pill w">${esc(tr("doubtful_tag"))}</span> `:""}${w?`<p class="m" style="margin-top:4px">${esc(reason(w))}</p>`:""}</div></div>`}).join(""):`<p class="empty">${esc(tr("none"))}</p>`;
}

function renderHit(){
  $("t-hit").textContent=tr("hit");const g=D.backtest.grade,f=D.backtest.form;
  $("hit-lead").textContent=g&&f?tr("hit_lead",{n:g.n,a:pct(g.best[0]),b:pct(g.best[1]),c:pct(g.any[0]),d:pct(g.any[1]),e:pct(f.best[0]),f:pct(f.best[1])}):"";
  $("hit-live").textContent=tr("hit_live");
  $("hit").innerHTML=g?D.targets.map(t=>{const v=g.by[String(t)];if(!v)return"";return `<div class="hrow"><span>${esc(tr("step"))} ${num(t)}</span><span class="t"><i style="width:${(v[1]*100).toFixed(1)}%;background:color-mix(in srgb,var(--acc) 35%,transparent)"></i><i style="width:${(v[0]*100).toFixed(1)}%;background:var(--acc);height:50%;top:25%"></i></span><span class="v">${esc(pct(v[0]))} / ${esc(pct(v[1]))}</span></div>`}).join(""):"";
  $("hit-leg").innerHTML=`<span><i style="background:var(--acc)"></i>${esc(tr("pred"))}</span><span><i style="background:color-mix(in srgb,var(--acc) 35%,transparent)"></i>${esc(tr("real"))}</span>`;
  $("foot").textContent=tr("foot");
}

function renderPerfect(){
  $("t-pr").textContent=tr("pr");$("pr-lead").textContent=tr("pr_lead");$("t-pr-g").textContent=tr("pr_g");$("t-pr-d").textContent=tr("pr_d");
  const P=D.perfect;
  if(!P){$("pr-ctl").hidden=true;$("pr-out").innerHTML=`<p class="empty">${esc(tr("pr_nodata"))}</p>`;return}
  const s0=P.start.stage,T=P.targets,Gs=[];for(let g=s0;g<=T.length;g++)Gs.push(g);
  const last=D.days[D.days.length-1],pv=(g,d)=>(P.plans[g+"_"+d]||{p:0}).p;
  if(!Gs.includes(S.prg)){let g=s0;for(const x of Gs)if(pv(x,last)>=.3)g=x;S.prg=g}  // Standard: höchste Stufe mit mind. 30 %
  if(!D.days.includes(S.prd))S.prd=last;
  $("pr-g").innerHTML=Gs.map(g=>`<button class="fchip" data-g="${g}" aria-pressed="${g===S.prg}">${esc(tr("pr_gl",{s:g,t:num(T[g-1])}))}</button>`).join("");
  $("pr-d").innerHTML=D.days.map(d=>`<button class="fchip" data-d="${d}" aria-pressed="${d===S.prd}">${esc(dayShort(d))}</button>`).join("");
  for(const b of $("pr-g").querySelectorAll("button"))b.onclick=()=>{S.prg=+b.dataset.g;store.set("pr",[S.prg,S.prd]);renderPerfect()};
  for(const b of $("pr-d").querySelectorAll("button"))b.onclick=()=>{S.prd=b.dataset.d;store.set("pr",[S.prg,S.prd]);renderPerfect()};
  const pl=P.plans[S.prg+"_"+S.prd]||{p:0,steps:[]};
  const mt=m=>m===1?tr("pr_m1"):tr("pr_mn",{m});
  let h=`<div class="prhead"><span class="prbig">${esc(pct(pl.p))}</span><div><b>${esc(tr("pr_head",{d:dayLong(S.prd),s:S.prg,t:num(T[S.prg-1])}))}</b><p>${esc(tr("pr_start",{s:s0,l:P.start.lives}))} · ${esc(tr("pr_notes"))}</p>${pl.steps.length?`<p>${esc(tr("pr_direct",{p:pct(pl.steps.reduce((a,x)=>a*x.q,1))}))}</p>`:""}</div></div>`;
  if(!pl.p||!pl.steps.length){$("pr-out").innerHTML=h+`<p class="empty">${esc(tr("pr_none"))}</p>`;return}
  h+=`<ol class="prsteps">`+pl.steps.map((st,k)=>{const lg=P.legs[st.leg],lu=P.lu[st.leg+"_"+st.s];
    const span=lg.a===lg.b?when(lg.a):when(lg.a)+" – "+when(lg.b);
    const rt=!st.retry?tr("pr_noretry"):st.retry.reset?tr("pr_reset"):tr("pr_retry",{t:when(P.legs[st.retry.leg].a),m:mt(st.retry.m)});
    const lus=(lu?lu.l:[]).slice(0,st.m).map((l,j)=>`${st.m>1?`<p class="prsub">${esc(tr("lu",{n:j+1}))} · ${esc(pct(l.p))}</p>`:""}<div class="strip">${l.pl.map(([id,slot,c,cs,ed,b])=>card(id,slot,c,cs,ed,b).replace('class="cd ','class="cd sm ')).join("")}</div>`).join("");
    return `<li class="prstep"><div class="prs-h"><span class="prn">${k+1}</span><div><h3>${esc(tr("pr_step",{s:st.s,t:num(T[st.s-1])}))}</h3><p>${esc(span)} · ${esc(mt(st.m))} · ${esc(tr("pr_q",{p:pct(st.q)}))}</p></div></div>${lus}<p class="prr">${esc(rt)}</p></li>`+(k<pl.steps.length-1&&lg.next?`<li class="prgap">${esc(tr("pr_gap",{t:when(lg.next)}))}</li>`:"")}).join("")+`</ol>`;
  $("pr-out").innerHTML=h;
}

function renderMatchups(){
  $("t-mu").textContent=tr("mu");$("mu-lead").textContent=tr("mu_lead");
  const keys=[["win","s_win"],["cs","s_cs"],["xg","s_xg"]];
  $("mu-sort").innerHTML=keys.map(([k,l])=>`<button class="fchip" data-k="${k}" aria-pressed="${S.mu===k}">${esc(tr(l))}</button>`).join("");
  for(const b of $("mu-sort").querySelectorAll("button"))b.onclick=()=>{S.mu=b.dataset.k;store.set("mu",S.mu);renderMatchups()};
  const rows=[];for(const m of D.matchups||[]){if(!inWin(m.date))continue;rows.push({m,t:m.home,o:m.away,h:1},{m,t:m.away,o:m.home,h:0})}
  const val=r=>r.t[S.mu]??-1;rows.sort((a,b)=>val(b)-val(a));
  if(!rows.length){$("mu").innerHTML=`<p class="empty">${esc(tr("no_mu"))}</p>`;return}
  const p1=v=>v==null?"–":pct(v);const g2=v=>v==null?"–":new Intl.NumberFormat(S.lang,{minimumFractionDigits:1,maximumFractionDigits:1}).format(v);
  $("mu").innerHTML=rows.slice(0,16).map((r,k)=>{const t=r.t,f=t.form;const big=S.mu==="xg"?g2(t.xg):p1(t[S.mu]);
    const w=t.win||0,dd=t.draw||0,l=t.lose||0;
    const cards=(t.cards||[]).map(id=>{const it=D.items[id];return it?`<span class="chip2"><i class="${edc(it.ed)}"></i>${esc(it.n)} <b>${num(it.mean)}</b></span>`:""}).join("");
    return `<article class="mc"><div class="mh"><span class="rk">${k+1}</span><div><h3>${esc(t.name)}</h3><p class="m">${esc(tr("vs"))} ${esc(r.o.name)} · ${esc(tr(r.h?"home_s":"away_s"))} · ${esc(when(r.m.date))} · ${esc(r.m.comp)}</p></div><span class="big">${esc(big)}</span></div>
<div><div class="wdl" aria-hidden="true"><i class="w" style="width:${(w*100).toFixed(1)}%"></i><i class="d" style="width:${(dd*100).toFixed(1)}%"></i><i class="l" style="width:${(l*100).toFixed(1)}%"></i></div><p class="wdlt">${esc(tr("wdl",{w:p1(t.win),d:p1(t.draw),l:p1(t.lose)}))}</p></div>
<dl class="ms"><div><dt>${esc(tr("m_cs"))}</dt><dd>${esc(p1(t.cs))}</dd></div><div><dt>${esc(tr("m_xg"))}</dt><dd>${esc(g2(t.xg))}</dd></div><div><dt>${esc(tr("m_g3"))}</dt><dd>${esc(p1(t.g3))}</dd></div></dl>
<div class="mrow"><span>${esc(tr("m_form"))} ${f&&f.res?[...f.res].map(c=>`<span class="fm ${c}">${esc(tr("f"+c))}</span>`).join(""):"–"}</span><span class="mute">${f?esc(tr("m_gfa"))+" "+esc(g2(f.gf))+" : "+esc(g2(f.ga)):""}</span></div>
<div><p class="mute" style="font-size:13px;margin-bottom:4px">${esc(tr("m_cards"))}</p><div class="mcards">${cards||`<span class="mute" style="font-size:13px">${esc(tr("no_cards"))}</span>`}</div></div></article>`}).join("");
}

function render(){renderNav();renderHero();renderDetail();renderMore();renderPerfect();renderTime();renderMine();renderMatchups();renderPlayers();renderHit()}

function start(data){
  D=data;
  // kompakte Daten aufklappen: Karten-Nummer -> [Slug, Edition, Bonus]; gleiche Variante "fraglich" -> Standardvariante
  if(D.cards){for(const v of ["0","1"])for(const T in D.sugg[v])for(const w in D.sugg[v][T]){const x=D.sugg[v][T][w];if(x&&!x._u){x._u=1;for(const l of x.l)l.pl=l.pl.map(([id,slot,c,ci])=>[id,slot,c,...D.cards[ci]])}}
    for(const T in D.sugg["1"])for(const w in D.sugg["1"][T])if(!D.sugg["1"][T][w])D.sugg["1"][T][w]=D.sugg["0"][T][w];
    if(D.perfect)for(const k in D.perfect.lu)for(const l of D.perfect.lu[k].l)l.pl=l.pl.map(([id,slot,c,ci])=>[id,slot,c,...D.cards[ci]]);}
  S.T=store.get("T",D.focus.target);if(!D.targets.includes(S.T))S.T=D.focus.target;
  const w=store.get("win",[0,0]),mx=D.days.length-1;S.from=Math.max(0,Math.min(+w[0]||0,mx));S.to=Math.max(S.from,Math.min(+w[1]||0,mx));
  S.lives=D.focus.key==="focus_after_reset"?4:(D.board.current?D.board.current.remaining:4);
  $("lang").onclick=()=>{S.lang=S.lang==="de"?"en":"de";store.set("lang",S.lang);render()};
  const onRange=which=>()=>{let f=+$("dfrom").value,t=+$("dto").value;if(which==="f"&&f>t)t=f;if(which==="t"&&t<f)f=t;S.from=f;S.to=t;store.set("win",[f,t]);render()};
  $("dfrom").oninput=onRange("f");$("dto").oninput=onRange("t");
  $("dbt").onchange=e=>{S.dbt=e.target.checked;store.set("dbt",S.dbt);render()};
  $("bell").onclick=()=>{const p=$("notes");p.hidden=!p.hidden;$("bell").setAttribute("aria-expanded",String(!p.hidden))};
  render();
}
fetch("page_data.json").then(r=>r.json()).then(start).catch(()=>{document.querySelector("main").innerHTML=`<section class="band"><div class="wrap"><p class="bad">Daten konnten nicht geladen werden / data could not be loaded.</p></div></section>`});
}
</script>
</body>
